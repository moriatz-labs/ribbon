name: Release VSCD

on:
  workflow_dispatch:

concurrency:
  group: vscd-production
  cancel-in-progress: true

jobs:
  deploy-console:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source
        run: pnpm check
      - name: Pull Vercel settings
        working-directory: apps/console
        run: pnpm dlx vercel@50.28.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build once
        working-directory: apps/console
        shell: bash
        run: |
          pnpm dlx vercel@50.28.0 build --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel-build.log
          if grep -Eq 'error TS[0-9]+' /tmp/vercel-build.log; then
            echo "Vercel emitted TypeScript errors while packaging functions."
            exit 1
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy the verified artifact
        id: deploy
        working-directory: apps/console
        shell: bash
        run: echo "url=$(pnpm dlx vercel@50.28.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Publish deployment URL
        shell: bash
        run: |
          printf '{"project":"vscd","url":"%s","commit":"%s"}\n' "${{ steps.deploy.outputs.url }}" "${{ github.sha }}" > deployment.json
          cat deployment.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-url
          path: deployment.json
          retention-days: 30

